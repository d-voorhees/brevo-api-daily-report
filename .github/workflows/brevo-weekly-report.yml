name: Brevo Weekly Report

on:
  workflow_dispatch:
    inputs:
      report_end_date:
        description: "Week-ending date in America/Denver, YYYY-MM-DD (the report covers the 7 nights up to this date's 10 PM)"
        required: false
        type: string
  schedule:
    # Sunday 10:00 PM MDT, UTC-6 (falls on Monday in UTC)
    - cron: "0 4 * * 1"
    # Sunday 10:00 PM MST, UTC-7 (falls on Monday in UTC)
    - cron: "0 5 * * 1"

permissions:
  contents: read

jobs:
  weekly-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run weekly report
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          REPORT_FROM: ${{ secrets.REPORT_FROM }}
          REPORT_TO: ${{ secrets.REPORT_TO }}
          REPORT_END_DATE: ${{ github.event.inputs.report_end_date }}
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
          REPORT_MODE: weekly
        run: npm run report
